<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeAssist Core Values Draw</title>
  <style>
    :root {
      --bg: #0D1B4C;
      --accent-yellow: #FFD700;
      --accent-orange: #FF4500;
      --accent-red: #FF2E2E;
      --accent-green: #7FFF00;
      --text: #FFFFFF;
      --muted: rgba(255,255,255,0.7);
      --shadow: #2E2E2E;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial;
      background: radial-gradient(1000px 600px at 50% -10%, #13235a 0%, var(--bg) 60%);
      color: var(--text);
      overflow: hidden;
    }
    .wrap { display: grid; grid-template-rows: auto 1fr auto; height: 100%; position: relative; z-index: 2; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; gap: 12px; }
    .brand { font-weight: 900; letter-spacing: 0.4px; color: var(--accent-yellow); font-size: 22px; }
    .controls { display: flex; align-items: center; gap: 10px; }
    .icon-btn { all: unset; cursor: pointer; padding: 8px 12px; border-radius: 10px; display: inline-flex; align-items:center; justify-content:center; color: var(--accent-yellow); border:1px solid var(--accent-yellow); }
    .icon-btn:hover { background: rgba(255,255,255,.1); }
    main { display: grid; place-items: center; position: relative; }
    .stage { width: min(900px, 92vw); background: rgba(255,255,255,0.05); border: 2px solid var(--accent-orange); box-shadow: 0 20px 70px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.08); border-radius: 22px; padding: 28px 26px 32px; display: grid; gap: 18px; }
    .drumroll { display: none; text-align: center; font-size: clamp(22px, 4vw, 40px); font-weight: 900; color: var(--accent-yellow); text-shadow: 0 0 12px var(--accent-orange), 0 0 28px var(--accent-red); letter-spacing: .5px; animation: glow 1s ease-in-out infinite alternate; }
    @keyframes glow { from { filter: drop-shadow(0 0 2px var(--accent-yellow)); } to { filter: drop-shadow(0 0 16px var(--accent-orange)); } }
    .countdown { display:none; font-size: clamp(42px, 10vw, 120px); font-weight: 900; text-align:center; color: var(--accent-green); text-shadow: 0 0 16px var(--accent-red); }
    .result { display: grid; gap: 10px; text-align: center; }
    .winner-name { font-size: clamp(30px, 6vw, 72px); font-weight: 900; line-height: 1.05; letter-spacing: -1.2px; text-shadow: 0 4px 32px var(--shadow); color: var(--accent-green); white-space: pre-line; }
    .prize { font-size: clamp(18px, 3.2vw, 30px); color: var(--accent-orange); font-weight: 700; }
    .cta { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 8px; }
    .draw-btn { background: linear-gradient(180deg, var(--accent-red), var(--accent-orange)); border: none; color: white; font-weight: 800; letter-spacing: .5px; padding: 18px 28px; border-radius: 18px; cursor: pointer; font-size: 18px; box-shadow: 0 12px 30px rgba(255, 69, 0, .45); transition: transform .06s ease; }
    .draw-btn:active { transform: translateY(1px) scale(.995); }
    .draw-btn[disabled] { opacity: .6; cursor: not-allowed; }
    footer { display: flex; justify-content: center; padding: 14px; color: var(--accent-yellow); font-size: 12px; font-weight: 600; text-shadow: 0 0 8px rgba(0,0,0,.5); }
    dialog { border: none; border-radius: 16px; padding: 0; width: min(920px, 92vw); }
    .modal-card { background: var(--bg); color: var(--text); border: 2px solid var(--accent-red); border-radius: 16px; overflow: hidden; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--accent-orange); color: #fff; font-weight: 700; }
    .modal-body { display: grid; gap: 16px; padding: 16px; }
    .grid { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
    textarea { width: 100%; min-height: 220px; resize: vertical; border-radius: 12px; background: #0c133a; color: var(--text); border: 1px solid var(--accent-yellow); padding: 12px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .save-btn { background: var(--accent-green); border: none; color: #062116; font-weight: 800; padding: 12px 16px; border-radius: 12px; cursor: pointer; }
    .danger-btn { background: var(--accent-red); border: none; color: #fff; font-weight: 800; padding: 10px 12px; border-radius: 12px; cursor: pointer; }
    .ghost-btn { background: transparent; border: 1px solid #26305f; color: var(--text); padding: 8px 12px; border-radius: 12px; cursor: pointer; font-weight: 600; }
    .pin-wrap { display:flex; gap:8px; align-items:center; }
    .pin-input { background: #0c133a; border:1px solid var(--accent-yellow); color: var(--text); padding: 8px 10px; border-radius: 10px; width: 120px; letter-spacing: 5px; text-align: center; }
    .chip { display:inline-flex; align-items:center; gap:8px; background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.18); padding:8px 10px; border-radius: 12px; }
    .chip input { width: 72px; text-align: center; font-weight: 800; background: #0c133a; border:1px solid var(--accent-yellow); color: var(--text); padding: 6px 8px; border-radius: 9px; }
    #confettiCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
    .bg { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
    .bg-layer { position:absolute; inset:-10%; background-size: 600px auto; background-repeat: repeat; opacity: .18; filter: drop-shadow(0 0 18px rgba(255, 153, 0, .25)); }
    .bg-layer.layer1 { animation: pan1 32s linear infinite; }
    .bg-layer.layer2 { animation: pan2 48s linear infinite; opacity: .12; }
    @keyframes pan1 { from { transform: translate3d(0,0,0) scale(1.05); } to { transform: translate3d(-20%, -10%, 0) scale(1.05); } }
    @keyframes pan2 { from { transform: translate3d(0,0,0) scale(1.08); } to { transform: translate3d(20%, 15%, 0) scale(1.08); } }
    .sync-status { position: fixed; top: 10px; right: 10px; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; z-index: 999; }
    .sync-status.connected { background: var(--accent-green); color: #062116; }
    .sync-status.disconnected { background: var(--accent-red); color: #fff; }
  </style>
</head>
<body>
  <div class="sync-status" id="syncStatus">Connecting...</div>
  <div class="bg" aria-hidden="true">
    <div class="bg-layer layer1" id="bg1"></div>
    <div class="bg-layer layer2" id="bg2"></div>
  </div>
  <canvas id="confettiCanvas"></canvas>
  <audio id="sound-draw" src="https://actions.google.com/sounds/v1/alarms/trumpet_fanfare.ogg" preload="auto"></audio>
  <audio id="sound-win" src="https://actions.google.com/sounds/v1/crowds/cheer.ogg" preload="auto"></audio>

  <div class="wrap">
    <header>
      <div class="brand">🎉 WEASSIST CORE VALUES DRAW</div>
      <div class="controls">
        <button class="icon-btn" id="openAdmin" title="Open admin">⚙️ Admin</button>
      </div>
    </header>

    <main>
      <section class="stage" aria-live="polite" aria-atomic="true">
        <div class="drumroll" id="drumroll">🥁 Our core values star is...</div>
        <div class="countdown" id="countdown">5</div>
        <div class="result" id="result">
          <div class="winner-name" id="winnerName">—</div>
          <div class="prize" id="prize">—</div>
        </div>
        <div class="cta">
          <button class="draw-btn" id="drawBtn">DRAW</button>
        </div>
      </section>
    </main>

    <footer>
      <span>🔥 Real-time sync enabled - Everyone sees the same data!</span>
    </footer>
  </div>

  <dialog id="adminModal">
    <div class="modal-card">
      <div class="modal-head">
        <strong>Admin Panel</strong>
        <button class="icon-btn" id="closeAdmin" title="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="pin-wrap">
            <label for="pinInput">PIN:</label>
            <input id="pinInput" class="pin-input" placeholder="••••" maxlength="8" type="password" autocomplete="off">
            <button class="ghost-btn" id="unlockBtn">Unlock</button>
          </div>
          <span id="pinMsg" style="color: var(--accent-red);"></span>
        </div>
        <div id="adminFields" style="display:none;">
          <div class="grid">
            <div>
              <label><strong>Names (one per line):</strong></label>
              <textarea id="namesInput" placeholder="Jane Doe&#10;John Smith&#10;..."></textarea>
            </div>
            <div>
              <label><strong>Prizes (one per line):</strong></label>
              <textarea id="prizesInput" placeholder="iPad 10th Gen&#10;Gift Card $50&#10;..."></textarea>
            </div>
          </div>
          <div class="row" style="justify-content: space-between;">
            <div class="row" style="gap:8px;">
              <button class="save-btn" id="saveLists">Save Lists</button>
              <button class="ghost-btn" id="importSample">Load Sample Data</button>
            </div>
            <div class="row" style="gap:8px;">
              <span class="chip">Names per prize
                <input type="number" id="winnersPerPrize" min="1" max="20" step="1" value="1">
              </span>
              <span class="chip">Background
                <input type="file" id="bgUpload" accept="image/*" style="width:180px;">
              </span>
              <button class="danger-btn" id="resetAll">Reset Everything</button>
            </div>
          </div>
          <div class="row" style="gap:8px;">
            <input id="bgUrl" placeholder="Paste background image URL (optional)" style="flex:1; padding:10px; border-radius:10px; border:1px solid var(--accent-yellow); background:#0c133a; color:var(--text)">
            <button class="ghost-btn" id="applyBg">Apply Background</button>
            <button class="ghost-btn" id="clearBg">Clear Background</button>
          </div>
          <div>
            <details>
              <summary style="cursor:pointer;color:var(--muted)">Winners History (synced across all users)</summary>
              <div id="history" style="margin-top:8px; font-size: 14px; color: var(--muted);"></div>
            </details>
          </div>
        </div>
      </div>
    </div>
  </dialog>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getDatabase, ref, set, get, onValue, push } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD6mCQ9HYyCs8I0eiu1BV2IiAVslS3czG0",
      authDomain: "weassist-raffle.firebaseapp.com",
      databaseURL: "https://weassist-raffle-default-rtdb.firebaseio.com",
      projectId: "weassist-raffle",
      storageBucket: "weassist-raffle.firebasestorage.app",
      messagingSenderId: "206962270477",
      appId: "1:206962270477:web:d9298b229b99e24282d044"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const ADMIN_PIN = '0000';

    // UI refs
    const drawBtn = document.getElementById('drawBtn');
    const drumrollEl = document.getElementById('drumroll');
    const countdownEl = document.getElementById('countdown');
    const winnerNameEl = document.getElementById('winnerName');
    const prizeEl = document.getElementById('prize');
    const soundDraw = document.getElementById('sound-draw');
    const soundWin = document.getElementById('sound-win');
    const adminModal = document.getElementById('adminModal');
    const openAdmin = document.getElementById('openAdmin');
    const closeAdmin = document.getElementById('closeAdmin');
    const unlockBtn = document.getElementById('unlockBtn');
    const pinInput = document.getElementById('pinInput');
    const pinMsg = document.getElementById('pinMsg');
    const adminFields = document.getElementById('adminFields');
    const namesInput = document.getElementById('namesInput');
    const prizesInput = document.getElementById('prizesInput');
    const saveLists = document.getElementById('saveLists');
    const importSample = document.getElementById('importSample');
    const resetAll = document.getElementById('resetAll');
    const winnersPerPrizeInput = document.getElementById('winnersPerPrize');
    const bgUpload = document.getElementById('bgUpload');
    const bgUrl = document.getElementById('bgUrl');
    const applyBg = document.getElementById('applyBg');
    const clearBg = document.getElementById('clearBg');
    const bg1 = document.getElementById('bg1');
    const bg2 = document.getElementById('bg2');
    const syncStatus = document.getElementById('syncStatus');

    let drawing = false;
    let currentData = { names: [], prizes: [], winnersPerPrize: 1 };

    // Sync status
    const connectedRef = ref(db, '.info/connected');
    onValue(connectedRef, (snap) => {
      if (snap.val() === true) {
        syncStatus.textContent = '🔥 Connected';
        syncStatus.className = 'sync-status connected';
      } else {
        syncStatus.textContent = '⚠️ Disconnected';
        syncStatus.className = 'sync-status disconnected';
      }
    });

    // Listen to data changes
    const dataRef = ref(db, 'raffleData');
    onValue(dataRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        currentData = {
          names: data.names || [],
          prizes: data.prizes || [],
          winnersPerPrize: data.winnersPerPrize || 1
        };
        // Apply background if exists
        if (data.backgroundUrl) {
          setBackground(data.backgroundUrl);
        } else {
          setBackground(null);
        }
      }
    });

    // Listen to history changes
    const historyRef = ref(db, 'raffleHistory');
    onValue(historyRef, (snapshot) => {
      renderHistory(snapshot.val());
    });

    function renderHistory(history) {
      const el = document.getElementById('history');
      if (!el) return;
      if (!history) { el.innerHTML = '<em>No draws yet.</em>'; return; }
      const entries = Object.values(history).sort((a, b) => new Date(b.at) - new Date(a.at));
      el.innerHTML = entries.map(h => {
        const dt = new Date(h.at);
        const who = Array.isArray(h.names) ? h.names.join(', ') : h.name;
        return `• <strong>${escapeHtml(who)}</strong> won <strong>${escapeHtml(h.prize)}</strong> <span style="opacity:.7">(${dt.toLocaleString()})</span>`;
      }).join('<br>');
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]));
    }

    function updateResult(namesOrName, prize) {
      if (Array.isArray(namesOrName)) {
        winnerNameEl.textContent = namesOrName.join('\n');
      } else {
        winnerNameEl.textContent = namesOrName;
      }
      prizeEl.textContent = prize === '-' ? '-' : `Prize: ${prize}`;
    }

    updateResult('-', '-');

    // Admin
    openAdmin.addEventListener('click', () => {
      adminModal.showModal();
      pinInput.value = '';
      pinMsg.textContent = '';
      adminFields.style.display = 'none';
      pinInput.focus();
    });

    closeAdmin.addEventListener('click', () => adminModal.close());

    adminModal.addEventListener('click', (e) => {
      const card = adminModal.querySelector('.modal-card').getBoundingClientRect();
      const inside = e.clientX >= card.left && e.clientX <= card.right && e.clientY >= card.top && e.clientY <= card.bottom;
      if (!inside) adminModal.close();
    });

    unlockBtn.addEventListener('click', () => {
      if (pinInput.value === ADMIN_PIN) {
        adminFields.style.display = 'block';
        pinMsg.textContent = '';
        namesInput.value = (currentData.names || []).join('\n');
        prizesInput.value = (currentData.prizes || []).join('\n');
        winnersPerPrizeInput.value = currentData.winnersPerPrize || 1;
        // Load current background URL if exists
        get(dataRef).then((snapshot) => {
          const data = snapshot.val();
          if (data && data.backgroundUrl) {
            bgUrl.value = data.backgroundUrl;
          }
        });
      } else {
        pinMsg.textContent = 'Incorrect PIN';
        adminFields.style.display = 'none';
      }
    });

    saveLists.addEventListener('click', async () => {
      const names = splitLines(namesInput.value);
      const prizes = splitLines(prizesInput.value);
      const wpp = Math.max(1, Math.min(20, parseInt(winnersPerPrizeInput.value || '1', 10)));
      
      await set(dataRef, {
        names,
        prizes,
        winnersPerPrize: wpp
      });
      
      toast('Lists saved & synced to all users!');
    });

    importSample.addEventListener('click', () => {
      namesInput.value = ['Alex Kim', 'Jordan Lee', 'Sam Rivera', 'Taylor Cruz', 'Casey Morgan', 'Riley Chen', 'Avery Patel', 'Jamie Santos'].join('\n');
      prizesInput.value = ['Wireless Headphones', 'Smartwatch', 'Gift Card $50', 'Coffee Maker', 'Bluetooth Speaker', 'Portable SSD 1TB', 'Movie Tickets (2)', 'Surprise Box'].join('\n');
    });

    resetAll.addEventListener('click', async () => {
      if (!confirm('This clears names, prizes, and history for ALL USERS. Continue?')) return;
      await set(ref(db, 'raffleData'), { names: [], prizes: [], winnersPerPrize: 1 });
      await set(ref(db, 'raffleHistory'), null);
      namesInput.value = prizesInput.value = '';
      winnersPerPrizeInput.value = 1;
      updateResult('-', '-');
      toast('Everything reset for all users.');
    });

    function splitLines(text) {
      return text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split(/\n/).map(s => s.trim()).filter(Boolean);
    }

    function setBackground(url) {
      if (url) {
        bg1.style.backgroundImage = `url(${url})`;
        bg2.style.backgroundImage = `url(${url})`;
        bg1.style.display = bg2.style.display = 'block';
      } else {
        bg1.style.display = bg2.style.display = 'none';
        bg1.style.backgroundImage = bg2.style.backgroundImage = 'none';
      }
    }

    // Background upload via file
    bgUpload.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      
      // Check file size (limit to 5MB)
      if (file.size > 5 * 1024 * 1024) {
        alert('Image too large! Please use an image under 5MB.');
        return;
      }
      
      const reader = new FileReader();
      reader.onload = async () => {
        const dataUrl = reader.result;
        const snapshot = await get(dataRef);
        const currentDataSnap = snapshot.val() || {};
        await set(dataRef, {
          ...currentDataSnap,
          backgroundUrl: dataUrl
        });
        toast('Background uploaded & synced!');
      };
      reader.readAsDataURL(file);
    });

    // Background apply URL
    applyBg.addEventListener('click', async () => {
      const url = (bgUrl.value || '').trim();
      if (!url) {
        toast('Please paste a valid image URL or upload a file.');
        return;
      }
      const snapshot = await get(dataRef);
      const currentDataSnap = snapshot.val() || {};
      await set(dataRef, {
        ...currentDataSnap,
        backgroundUrl: url
      });
      toast('Background applied & synced!');
    });

    // Background clear
    clearBg.addEventListener('click', async () => {
      const snapshot = await get(dataRef);
      const currentDataSnap = snapshot.val() || {};
      await set(dataRef, {
        ...currentDataSnap,
        backgroundUrl: null
      });
      bgUrl.value = '';
      toast('Background cleared for all users.');
    });

    drawBtn.addEventListener('click', async () => {
      if (drawing) return;
      const { names, prizes, winnersPerPrize } = currentData;
      
      if (!names.length) { alert('No names available. Add names in Admin.'); return; }
      if (!prizes.length) { alert('No prizes available. Add prizes in Admin.'); return; }
      if (names.length < winnersPerPrize) { alert(`Not enough names (need ${winnersPerPrize}).`); return; }

      drawing = true;
      drawBtn.disabled = true;
      updateResult('—', '—');

      try { soundDraw.currentTime = 0; soundDraw.play(); } catch {}
      drumrollEl.style.display = 'block';
      countdownEl.style.display = 'block';
      let t = 5;
      countdownEl.textContent = t;
      await wait(1000);
      for (t = 4; t >= 1; t--) {
        countdownEl.textContent = t;
        await wait(1000);
      }
      drumrollEl.style.display = 'none';
      countdownEl.style.display = 'none';

      const pickedNames = [];
      const namesCopy = [...names];
      for (let i = 0; i < winnersPerPrize; i++) {
        const nIdx = Math.floor(Math.random() * namesCopy.length);
        pickedNames.push(namesCopy[nIdx]);
        namesCopy.splice(nIdx, 1);
      }

      const prizesCopy = [...prizes];
      const pIdx = Math.floor(Math.random() * prizesCopy.length);
      const prize = prizesCopy[pIdx];
      prizesCopy.splice(pIdx, 1);

      // Update Firebase
      await set(dataRef, {
        names: namesCopy,
        prizes: prizesCopy,
        winnersPerPrize
      });

      // Save to history
      await push(historyRef, {
        names: pickedNames,
        prize,
        at: new Date().toISOString()
      });

      updateResult(pickedNames, prize);
      try { soundWin.currentTime = 0; soundWin.play(); } catch {}
      burstConfetti();
      drawing = false;
      drawBtn.disabled = false;
    });

    function wait(ms) { return new Promise(res => setTimeout(res, ms)); }

    // Confetti
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');
    let confetti = [];
    let confettiAnimating = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function burstConfetti() {
      const count = 220;
      confetti = [];
      for (let i = 0; i < count; i++) {
        confetti.push(spawnParticle());
      }
      if (!confettiAnimating) animateConfetti();
    }

    function spawnParticle() {
      const angle = Math.random() * Math.PI;
      const speed = Math.random() * 8 + 4;
      const vx = Math.cos(angle) * speed * (Math.random() < 0.5 ? -1 : 1);
      const vy = -Math.abs(Math.sin(angle) * speed) - 6;
      return {
        x: canvas.width / 2,
        y: canvas.height / 3,
        vx, vy,
        w: Math.random() * 8 + 4,
        h: Math.random() * 12 + 6,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3,
        life: 0,
        maxLife: 240 + Math.random() * 120,
        color: randomColor()
      };
    }

    function randomColor() {
      const palette = ['#FFD700', '#FF4500', '#FF2E2E', '#7FFF00', '#FFFFFF'];
      return palette[Math.floor(Math.random() * palette.length)];
    }

    function animateConfetti() {
      confettiAnimating = true;
      let last = performance.now();
      function frame(now) {
        const dt = Math.min(32, now - last);
        last = now;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const p of confetti) {
          p.vy += 0.12;
          p.x += p.vx * dt / 16;
          p.y += p.vy * dt / 16;
          p.rot += p.vr * dt / 16;
          p.life += dt;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
        confetti = confetti.filter(p => p.life < p.maxLife && p.y < canvas.height + 20);
        if (confetti.length) requestAnimationFrame(frame);
        else confettiAnimating = false;
      }
      requestAnimationFrame(frame);
    }

    function toast(msg) {
      const t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0e1440;color:#fff;border:1px solid rgba(255,255,255,.2);padding:10px 14px;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.35);z-index:9999;opacity:0;transition:opacity .2s ease';
      document.body.appendChild(t);
      requestAnimationFrame(() => { t.style.opacity = '1'; });
      setTimeout(() => {
        t.style.opacity = '0';
        setTimeout(() => t.remove(), 250);
      }, 1600);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'a' && e.shiftKey) openAdmin.click();
    });
  </script>
</body>
</html>
